<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>REPÚBLICA MEXICANA</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#eaf0f8;
    color:#333;
}

/* ENCABEZADO */

header{
    background:#173b63;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    margin:5px;
}

header p{
    margin:5px;
}

/* PANTALLAS */

.pantalla{
    display:none;
}

.activa{
    display:block;
}

/* CONTENEDOR */

.contenedor{
    background:white;
    width:400px;
    max-width:90%;
    margin:60px auto;
    padding:35px;
    border-radius:15px;
    box-shadow:0 4px 15px #0003;
    text-align:center;
}

/* BOTONES */

button{
    background:#173b63;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    margin:5px;
}

button:hover{
    background:#285b8e;
}

.boton-grande{
    width:80%;
    padding:15px;
    font-size:17px;
}

/* INPUTS */

input, select{
    width:90%;
    padding:11px;
    margin:8px;
    border:1px solid #bbb;
    border-radius:6px;
}

.mensaje{
    color:#c0392b;
    font-weight:bold;
}

/* PANEL */

#panelAdmin,
#panelContribuyente{
    min-height:100vh;
}

/* MENU */

nav{
    background:#285b8e;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    padding:10px;
}

nav button{
    background:transparent;
    margin:3px;
}

nav button:hover{
    background:#173b63;
}

/* CONTENIDO */

.contenido{
    background:white;
    width:90%;
    max-width:1100px;
    margin:30px auto;
    padding:30px;
    border-radius:15px;
    box-shadow:0 4px 15px #0003;
    text-align:center;
}

/* TABLAS */

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#173b63;
    color:white;
    padding:12px;
}

td{
    border:1px solid #ccc;
    padding:10px;
}

tr:nth-child(even){
    background:#f2f6fa;
}

/* BUSCADOR */

.buscador{
    width:60%;
    max-width:500px;
}

/* BOTONES CRUD */

.btn-editar{
    background:#2980b9;
}

.btn-eliminar{
    background:#c0392b;
}

.btn-agregar{
    background:#27ae60;
}

.btn-salir{
    background:#7f8c8d;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    z-index:1000;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:#0008;
}

.modal-contenido{
    background:white;
    width:400px;
    max-width:90%;
    margin:150px auto;
    padding:30px;
    border-radius:15px;
    text-align:center;
}

/* RESPONSIVO */

@media(max-width:700px){

    table{
        font-size:12px;
    }

    .contenido{
        width:95%;
        padding:15px;
        overflow-x:auto;
    }

    nav button{
        font-size:12px;
        padding:8px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     PANTALLA PRINCIPAL
===================================================== -->

<div id="inicio" class="pantalla activa">

<header>
    <h1>REPÚBLICA MEXICANA</h1>
    <p>Sistema de consulta de información</p>
</header>

<div class="contenedor">

    <h2>¡Bienvenido!</h2>

    <p>
        Selecciona el tipo de usuario para continuar.
    </p>

    <button class="boton-grande"
            onclick="mostrarLogin()">
        👩‍💼 ADMINISTRADOR
    </button>

    <br>

    <button class="boton-grande"
            onclick="entrarContribuyente()">
        👤 CONTRIBUYENTE
    </button>

</div>

</div>


<!-- =====================================================
     LOGIN ADMINISTRADOR
===================================================== -->

<div id="login" class="pantalla">

<header>
    <h1>REPÚBLICA MEXICANA</h1>
    <p>Inicio de sesión del administrador</p>
</header>

<div class="contenedor">

    <h2>Inicio de sesión</h2>

    <form onsubmit="iniciarSesion(event)">

        <input
            type="text"
            id="usuario"
            placeholder="Usuario"
            required>

        <input
            type="password"
            id="contrasena"
            placeholder="Contraseña"
            required>

        <br>

        <button type="submit">
            Iniciar sesión
        </button>

    </form>

    <button class="btn-salir"
            onclick="regresarInicio()">
        Regresar
    </button>

    <p id="mensajeLogin"
       class="mensaje"></p>

</div>

</div>


<!-- =====================================================
     PANEL ADMINISTRADOR
===================================================== -->

<div id="panelAdmin" class="pantalla">

<header>
    <h1>REPÚBLICA MEXICANA</h1>
    <p>Panel del Administrador</p>
</header>


<nav>

<button onclick="abrirInicioAdmin()">
    Inicio
</button>

<button onclick="abrirEstado()">
    Estado
</button>

<button onclick="abrirMunicipio()">
    Municipio
</button>

<button onclick="abrirCiudad()">
    Ciudad
</button>

<button onclick="abrirTipoAsentamiento()">
    Tipo de asentamiento
</button>

<button onclick="abrirAsentamientoAdmin()">
    Asentamiento
</button>

<button onclick="abrirZona()">
    Zona
</button>

<button onclick="abrirCodigoPostal()">
    Código postal
</button>

<button onclick="abrirAuditorias()">
    Auditorías
</button>

<button onclick="cerrarSesion()">
    Cerrar sesión
</button>

</nav>


<div id="contenidoAdmin"
     class="contenido">

</div>

</div>


<!-- =====================================================
     PANEL CONTRIBUYENTE
===================================================== -->

<div id="panelContribuyente"
     class="pantalla">

<header>

    <h1>REPÚBLICA MEXICANA</h1>

    <p>
        Consulta para contribuyentes
    </p>

</header>


<nav>

<button onclick="abrirAsentamientoContribuyente()">
    Asentamientos
</button>

<button onclick="cerrarContribuyente()">
    Salir
</button>

</nav>


<div id="contenidoContribuyente"
     class="contenido">

</div>

</div>


<!-- =====================================================
     MODAL
===================================================== -->

<div id="modal"
     class="modal">

<div class="modal-contenido">

    <h2 id="modalTitulo">
        Aviso
    </h2>

    <p id="modalMensaje"></p>

    <button onclick="cerrarModal()">
        Aceptar
    </button>

</div>

</div>



<script>

/* =====================================================
   DATOS
===================================================== */

let estados = [

    {
        id:1,
        nombre:"Estado de México"
    },

    {
        id:2,
        nombre:"Ciudad de México"
    },

    {
        id:3,
        nombre:"Puebla"
    }

];


let municipios = [

    {
        id:1,
        nombre:"Nezahualcóyotl",
        estado:"Estado de México"
    },

    {
        id:2,
        nombre:"Ecatepec",
        estado:"Estado de México"
    },

    {
        id:3,
        nombre:"Iztapalapa",
        estado:"Ciudad de México"
    }

];


let ciudades = [

    {
        id:1,
        nombre:"Ciudad Nezahualcóyotl",
        municipio:"Nezahualcóyotl"
    },

    {
        id:2,
        nombre:"Ecatepec de Morelos",
        municipio:"Ecatepec"
    }

];


let tiposAsentamiento = [

    {
        id:1,
        nombre:"Colonia"
    },

    {
        id:2,
        nombre:"Fraccionamiento"
    },

    {
        id:3,
        nombre:"Barrio"
    }

];


let asentamientos = [

    {
        id:1,
        nombre:"Benito Juárez",
        tipo:"Colonia",
        ciudad:"Ciudad Nezahualcóyotl",
        municipio:"Nezahualcóyotl",
        estado:"Estado de México",
        cp:"57000",
        zona:"Urbana"
    },

    {
        id:2,
        nombre:"Las Águilas",
        tipo:"Colonia",
        ciudad:"Ciudad Nezahualcóyotl",
        municipio:"Nezahualcóyotl",
        estado:"Estado de México",
        cp:"57170",
        zona:"Urbana"
    },

    {
        id:3,
        nombre:"Centro",
        tipo:"Barrio",
        ciudad:"Ecatepec de Morelos",
        municipio:"Ecatepec",
        estado:"Estado de México",
        cp:"55000",
        zona:"Urbana"
    }

];


let zonas = [

    {
        id:1,
        nombre:"Urbana"
    },

    {
        id:2,
        nombre:"Rural"
    }

];


let codigosPostales = [

    {
        id:1,
        codigo:"57000",
        asentamiento:"Benito Juárez"
    },

    {
        id:2,
        codigo:"57170",
        asentamiento:"Las Águilas"
    },

    {
        id:3,
        codigo:"55000",
        asentamiento:"Centro"
    }

];


/* =====================================================
   AUDITORIAS
===================================================== */

let auditorias = [];


function registrarAuditoria(accion, tabla, registro){

    let fecha = new Date();

    auditorias.push({

        fecha:
        fecha.toLocaleDateString()
        +" "
        +fecha.toLocaleTimeString(),

        usuario:"admin",

        accion:accion,

        tabla:tabla,

        registro:registro

    });

}


/* =====================================================
   CAMBIO DE PANTALLAS
===================================================== */

function ocultarTodo(){

    document
    .querySelectorAll(".pantalla")
    .forEach(
        pantalla =>
        pantalla.classList.remove("activa")
    );

}


/* =====================================================
   INICIO
===================================================== */

function mostrarLogin(){

    ocultarTodo();

    document
    .getElementById("login")
    .classList.add("activa");

}


function regresarInicio(){

    ocultarTodo();

    document
    .getElementById("inicio")
    .classList.add("activa");

}


function cerrarSesion(){

    document
    .getElementById("usuario")
    .value="";

    document
    .getElementById("contrasena")
    .value="";

    regresarInicio();

}


function iniciarSesion(event){

    event.preventDefault();

    let usuario =
        document.getElementById("usuario").value;

    let contrasena =
        document.getElementById("contrasena").value;


    if(
        usuario==="admin"
        &&
        contrasena==="1234"
    ){

        ocultarTodo();

        document
        .getElementById("panelAdmin")
        .classList.add("activa");

        abrirInicioAdmin();

    }

    else{

        document
        .getElementById("mensajeLogin")
        .textContent =
        "Usuario o contraseña incorrectos.";

    }

}


/* =====================================================
   CONTRIBUYENTE
===================================================== */

function entrarContribuyente(){

    ocultarTodo();

    document
    .getElementById("panelContribuyente")
    .classList.add("activa");

    abrirAsentamientoContribuyente();

}


function cerrarContribuyente(){

    regresarInicio();

}


/* =====================================================
   INICIO ADMIN
===================================================== */

function abrirInicioAdmin(){

    document
    .getElementById("contenidoAdmin")
    .innerHTML=`

        <h2>Bienvenido Administrador</h2>

        <p>
            Selecciona una opción del menú
            para administrar la información.
        </p>

        <p>
            Desde este panel puedes consultar,
            agregar, editar y eliminar registros.
        </p>

    `;

}


/* =====================================================
   ESTADOS
===================================================== */

function abrirEstado(){

    let html=`

        <h2>Estados</h2>

        <p>
            Consulta y actualización de estados.
        </p>

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>

            </thead>

            <tbody>

    `;


    estados.forEach((estado,index)=>{

        html+=`

            <tr>

                <td>
                    ${estado.id}
                </td>

                <td>
                    ${estado.nombre}
                </td>

                <td>

                    <button
                        class="btn-editar"
                        onclick="editarEstado(${index})">

                        Editar

                    </button>

                </td>

            </tr>

        `;

    });


    html+=`

            </tbody>

        </table>

    `;


    document
    .getElementById("contenidoAdmin")
    .innerHTML=html;

}


function editarEstado(index){

    let nuevoNombre =
        prompt(
            "Ingrese el nuevo nombre:",
            estados[index].nombre
        );


    if(
        nuevoNombre
        &&
        nuevoNombre.trim()!=""
    ){

        estados[index].nombre =
            nuevoNombre;

        registrarAuditoria(
            "ACTUALIZAR",
            "Estado",
            nuevoNombre
        );

        abrirEstado();

    }

}


/* =====================================================
   MUNICIPIO
===================================================== */

function abrirMunicipio(){

    let html=`

        <h2>Municipios</h2>

        <button
            class="btn-agregar"
            onclick="agregarMunicipio()">

            + Agregar municipio

        </button>

        <table>

        <thead>

        <tr>

            <th>ID</th>
            <th>Municipio</th>
            <th>Estado</th>
            <th>Acciones</th>

        </tr>

        </thead>

        <tbody>

    `;


    municipios.forEach((municipio,index)=>{

        html+=`

        <tr>

            <td>
                ${municipio.id}
            </td>

            <td>
                ${municipio.nombre}
            </td>

            <td>
                ${municipio.estado}
            </td>

            <td>

                <button
                    class="btn-editar"
                    onclick="editarMunicipio(${index})">

                    Editar

                </button>

                <button
                    class="btn-eliminar"
                    onclick="eliminarMunicipio(${index})">

                    Eliminar

                </button>

            </td>

        </tr>

        `;

    });


    html+=`

        </tbody>

        </table>

    `;


    document
    .getElementById("contenidoAdmin")
    .innerHTML=html;

}


function agregarMunicipio(){

    let nombre =
        prompt("Nombre del municipio:");

    if(!nombre) return;


    let estado =
        prompt("Estado al que pertenece:");

    if(!estado) return;


    let nuevo={

        id:municipios.length+1,

        nombre:nombre,

        estado:estado

    };


    municipios.push(nuevo);


    registrarAuditoria(
        "AGREGAR",
        "Municipio",
        nombre
    );


    abrirMunicipio();

}


function editarMunicipio(index){

    let nombre =
        prompt(
            "Nuevo nombre:",
            municipios[index].nombre
        );

    if(!nombre) return;


    municipios[index].nombre=nombre;


    registrarAuditoria(
        "ACTUALIZAR",
        "Municipio",
        nombre
    );


    abrirMunicipio();

}


function eliminarMunicipio(index){

    if(
        !confirm(
            "¿Deseas eliminar este municipio?"
        )
    ) return;


    let nombre =
        municipios[index].nombre;


    municipios.splice(index,1);


    registrarAuditoria(
        "ELIMINAR",
        "Municipio",
        nombre
    );


    abrirMunicipio();

}


/* =====================================================
   CIUDADES
===================================================== */

function abrirCiudad(){

    let html=`

        <h2>Ciudades</h2>

        <button
            class="btn-agregar"
            onclick="agregarCiudad()">

            + Agregar ciudad

        </button>

        <table>

        <thead>

        <tr>

            <th>ID</th>
            <th>Ciudad</th>
            <th>Municipio</th>
            <th>Acciones</th>

        </tr>

        </thead>

        <tbody>

    `;


    ciudades.forEach((ciudad,index)=>{

        html+=`

        <tr>

            <td>
                ${ciudad.id}
            </td>

            <td>
                ${ciudad.nombre}
            </td>

            <td>
                ${ciudad.municipio}
            </td>

            <td>

                <button
                    class="btn-editar"
                    onclick="editarCiudad(${index})">

                    Editar

                </button>

                <button
                    class="btn-eliminar"
                    onclick="eliminarCiudad(${index})">

                    Eliminar

                </button>

            </td>

        </tr>

        `;

    });


    html+=`

        </tbody>

        </table>

    `;


    document
    .getElementById("contenidoAdmin")
    .innerHTML=html;

}


function agregarCiudad(){

    let nombre =
        prompt("Nombre de la ciudad:");

    if(!nombre) return;


    let municipio =
        prompt("Municipio:");

    if(!municipio) return;


    ciudades.push({

        id:ciudades.length+1,

        nombre:nombre,

        municipio:municipio

    });


    registrarAuditoria(
        "AGREGAR",
        "Ciudad",
        nombre
    );


    abrirCiudad();

}


function editarCiudad(index){

    let nombre =
        prompt(
            "Nuevo nombre:",
            ciudades[index].nombre
        );

    if(!nombre) return;


    ciudades[index].nombre=nombre;


    registrarAuditoria(
        "ACTUALIZAR",
        "Ciudad",
        nombre
    );


    abrirCiudad();

}


function eliminarCiudad(index){

    if(
        !confirm(
            "¿Deseas eliminar esta ciudad?"
        )
    ) return;


    let nombre =
        ciudades[index].nombre;


    ciudades.splice(index,1);


    registrarAuditoria(
        "ELIMINAR",
        "Ciudad",
        nombre
    );


    abrirCiudad();

}


/* =====================================================
   TIPO DE ASENTAMIENTO
===================================================== */

function abrirTipoAsentamiento(){

    let html=`

        <h2>Tipos de asentamiento</h2>

        <button
            class="btn-agregar"
            onclick="agregarTipo()">

            + Agregar tipo

        </button>

        <table>

        <thead>

        <tr>

            <th>ID</th>
            <th>Tipo</th>
            <th>Acciones</th>

        </tr>

        </thead>

        <tbody>

    `;


    tiposAsentamiento.forEach((tipo,index)=>{

        html+=`

        <tr>

            <td>
                ${tipo.id}
            </td>

            <td>
                ${tipo.nombre}
            </td>

            <td>

                <button
                    class="btn-editar"
                    onclick="editarTipo(${index})">

                    Editar

                </button>

                <button
                    class="btn-eliminar"
                    onclick="eliminarTipo(${index})">

                    Eliminar

                </button>

            </td>

        </tr>

        `;

    });


    html+=`

        </tbody>

        </table>

    `;


    document
    .getElementById("contenidoAdmin")
    .innerHTML=html;

}


function agregarTipo(){

    let nombre =
        prompt("Nombre del tipo:");

    if(!nombre) return;


    tiposAsentamiento.push({

        id:tiposAsentamiento.length+1,

        nombre:nombre

    });


    registrarAuditoria(
        "AGREGAR",
        "Tipo de asentamiento",
        nombre
    );


    abrirTipoAsentamiento();

}


function editarTipo(index){

    let nombre =
        prompt(
            "Nuevo nombre:",
            tiposAsentamiento[index].nombre
        );

    if(!nombre) return;


    tiposAsentamiento[index].nombre=nombre;


    registrarAuditoria(
        "ACTUALIZAR",
        "Tipo de asentamiento",
        nombre
    );


    abrirTipoAsentamiento();

}


function eliminarTipo(index){

    if(
        !confirm(
            "¿Deseas eliminar este tipo?"
        )
    ) return;


    let nombre =
        tiposAsentamiento[index].nombre;


    tiposAsentamiento.splice(index,1);


    registrarAuditoria(
        "ELIMINAR",
        "Tipo de asentamiento",
        nombre
    );


    abrirTipoAsentamiento();

}


/* =====================================================
   ASENTAMIENTOS ADMIN
===================================================== */

function abrirAsentamientoAdmin(){

    let html=`

        <h2>Asentamientos</h2>

        <input
            class="buscador"
            id="buscarAsentamiento"
            placeholder="🔎 Buscar asentamiento..."
            onkeyup="buscarAsentamientoAdmin()">

        <br>

        <button
            class="btn-agregar"
            onclick="agregarAsentamiento()">

            + Agregar asentamiento

        </button>

        <div id="tablaAsentamientos">

            ${generarTablaAsentamientos(
                asentamientos,
                true
            )}

        </div>

    `;


    document
    .getElementById("contenidoAdmin")
    .innerHTML=html;

}


function generarTablaAsentamientos(
    datos,
    administrador
){

    let html=`

    <table>

    <thead>

    <tr>

        <th>ID</th>
        <th>Asentamiento</th>
        <th>Tipo</th>
        <th>Ciudad</th>
        <th>Municipio</th>
        <th>Estado</th>
        <th>CP</th>
        <th>Zona</th>
    `;


    if(administrador){

        html+=`

            <th>Acciones</th>

        `;

    }


    html+=`

    </tr>

    </thead>

    <tbody>

    `;


    datos.forEach(
        (asentamiento,index)=>{

        html+=`

        <tr>

            <td>
                ${asentamiento.id}
            </td>

            <td>
                ${asentamiento.nombre}
            </td>

            <td>
                ${asentamiento.tipo}
            </td>

            <td>
                ${asentamiento.ciudad}
            </td>

            <td>
                ${asentamiento.municipio}
            </td>

            <td>
                ${asentamiento.estado}
            </td>

            <td>
                ${asentamiento.cp}
            </td>

            <td>
                ${asentamiento.zona}
            </td>
        `;


        if(administrador){

            html+=`

            <td>

                <button
                    class="btn-editar"
                    onclick="editarAsentamiento(${index})">

                    Editar

                </button>

                <button
                    class="btn-eliminar"
                    onclick="eliminarAsentamiento(${index})">

                    Eliminar

                </button>

            </td>

            `;

        }


        html+=`

        </tr>

        `;

    });


    html+=`

    </tbody>

    </table>

    `;


    return html;

}


function buscarAsentamientoAdmin(){

        prompt("Nombre del asentamiento:");

        municipio:municipio,

        estado:estado,

    });

        "AGREGAR",
        "Asentamiento",
        nombre
    );


    abrirAsentamientoAdmin();

}

    );

        "ELIMINAR",

        nombre
    );


    abrirAsentamientoAdmin();

}
